<div
  class="cuadrante-fila"
  [class.superior-derecho]="orientacion() === 'superior-derecho'"
  [class.superior-izquierdo]="orientacion() === 'superior-izquierdo'"
  [class.inferior-derecho]="orientacion() === 'inferior-derecho'"
  [class.inferior-izquierdo]="orientacion() === 'inferior-izquierdo'">
  @for (diente of dientes(); track diente.numero) {
    <app-diente-grafico 
      [numeroDiente]="diente.numero"
      [caras]="diente.caras"
      [seleccionado]="numeroSeleccionado() === diente.numero"
      (dienteClickeado)="dienteClickeado.emit($event)"
      (caraClickeada)="caraClickeada.emit($event)">
    </app-diente-grafico>
  }
</div>
